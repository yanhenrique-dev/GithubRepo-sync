[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PIE", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tray.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
