name: ci
permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py core tray.py tests
      - run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff==0.16.8 pyright==1.1.414
      - run: ruff check app.py core tray.py
      - run: pyright --pythonpath python app.py core tray.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check static/app.js

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ! grep -rE 'ghp_|gho_|github_pat_|AKIA|BEGIN .*PRIVATE KEY' \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ \
            --exclude=.env --exclude=ci.yml . \
          && ! git ls-files | grep -E '(^|/)\.env$|\.alldown/.*\.json$|\.bak-'
